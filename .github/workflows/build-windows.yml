name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# First public release trigger: [release-v0.1.0]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tiny
            model: ggml-tiny-q5_1.bin
            size: "200000000"
          - name: base
            model: ggml-base-q5_1.bin
            size: "300000000"
          - name: small
            model: ggml-small-q5_1.bin
            size: "500000000"
          - name: medium
            model: ggml-medium-q5_0.bin
            size: "539000000"
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Prepare whisper.cpp and model
        env:
          CHORDS_MODEL: ${{ matrix.model }}
          CHORDS_MODEL_SIZE: ${{ matrix.size }}
        run: python scripts/setup_vendor.py
      - name: Build EXE
        env:
          CHORDS_MODEL: ${{ matrix.model }}
        run: python build_tools/build_exe.py
      - name: Verify PyInstaller output
        shell: pwsh
        run: |
          $app = "build/dist/ChordsApp/ChordsApp.exe"
          if (-not (Test-Path -LiteralPath $app)) { throw "PyInstaller output is missing: $app" }
          Get-Item -LiteralPath $app | Select-Object FullName, Length
      - name: Verify bundled Python runtime
        shell: pwsh
        run: |
          $root = "build/dist/ChordsApp"
          $app = Join-Path $root "ChordsApp.exe"
          if (-not (Test-Path -LiteralPath $app)) { throw "PyInstaller executable is missing: $app" }

          $pythonDll = Get-ChildItem -LiteralPath $root -Recurse -Filter "python311.dll" -File | Select-Object -First 1
          if ($null -eq $pythonDll) { throw "PyInstaller Python runtime is missing: python311.dll" }

          $internal = Join-Path $root "_internal"
          if (-not (Test-Path -LiteralPath $internal -PathType Container)) {
            Write-Warning "No _internal directory found; using legacy PyInstaller layout."
          }

          Write-Host "ChordsApp.exe:"
          Get-Item -LiteralPath $app | Select-Object FullName, Length
          Write-Host "python311.dll:"
          $pythonDll | Select-Object FullName, Length
          Write-Host "Runtime directory: $($pythonDll.DirectoryName)"

      - name: Rename EXE
        shell: pwsh
        run: Move-Item -LiteralPath "release/Chords.exe" -Destination "release/Chords-${{ matrix.name }}.exe" -Force
      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "release/Chords-${{ matrix.name }}.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "EXE was not created: $exe" }
          Get-Item -LiteralPath $exe | Select-Object FullName, Length
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Chords-Windows-${{ matrix.name }}
          path: release/Chords-${{ matrix.name }}.exe
          if-no-files-found: error
          retention-days: 14


  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-v0.1.0]'))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Tiny
        uses: actions/download-artifact@v4
        with:
          name: Chords-Windows-tiny
          path: release
      - name: Download Base
        uses: actions/download-artifact@v4
        with:
          name: Chords-Windows-base
          path: release
      - name: Download Small
        uses: actions/download-artifact@v4
        with:
          name: Chords-Windows-small
          path: release
      - name: Download Medium
        uses: actions/download-artifact@v4
        with:
          name: Chords-Windows-medium
          path: release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          # ChordsEngine — First public release

          תוכנת אקורדים ומילים לשירים בעברית — גרסת EXE ראשונה.

          ## ⚠️ סטטוס הפיתוח
          הפרויקט עדיין נמצא בשלבי פיתוח. זו גרסת Preview ראשונה לצורך בדיקות ומשוב.
          בשלב הנוכחי יש צורך ב-Python מותקן במחשב. בהמשך המטרה היא להפוך את ההפעלה לעצמאית ככל האפשר.

          ## ארבעת המודלים
          | מודל | גודל משוער | למי מומלץ |
          |---|---:|---|
          | Tiny | ~200 MB | מחשבים חלשים מאוד ובדיקות מהירות; עדיפות למהירות על פני דיוק |
          | Base | ~300 MB | מחשבים חלשים יחסית ושימוש בסיסי |
          | Small | ~500 MB | איזון בין איכות, מהירות ומשאבים |
          | Medium | ~539 MB | כאשר רוצים תמלול איכותי יותר ומוכנים להשקיע יותר זמן CPU |

          גודל הקובץ אינו מדד ישיר לאיכות. הביצועים תלויים גם במחשב ובאיכות ההקלטה.

          ## מה כלול
          - תמלול באמצעות whisper.cpp.
          - זיהוי אקורדים באמצעות lv-chordia.
          - שילוב המילים והאקורדים לדף אקורדים.
          - ארבע גרסאות EXE, אחת לכל מודל Whisper.

          ## בהמשך
          נוסיף מודלים כבדים וחזקים יותר, כולל מודלים ממשפחת Large, לצד שיפורים בדיוק, בביצועים ובממשק.

          ## איזה מודל לבחור?
          אם אינך בטוח, מומלץ לבדוק קודם את Small. אם הדיוק עדיין לא מספיק, נסה Medium.
          אם המחשב חלש או שהמהירות חשובה במיוחד, נסה Base או Tiny.

          תודה על הבדיקות והמשוב!
          EOF
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            TAG="v0.1.0"
            echo "Replacing tag ${TAG} with ${GITHUB_SHA}"
            git tag -f "${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}" --force
          fi

          echo "Publishing release ${TAG}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release/Chords-*.exe --clobber
          else
            gh release create "${TAG}" release/Chords-*.exe --title "ChordsEngine ${TAG} — First public release" --notes-file release-notes.md
          fi
