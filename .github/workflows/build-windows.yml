name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Prepare whisper.cpp and medium model
        run: python scripts/setup_vendor.py

      - name: Build EXE
        run: python build_tools/build_exe.py --skip-pyi

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Chords-Windows-medium
          path: release/Chords.exe
          if-no-files-found: error
          retention-days: 14
